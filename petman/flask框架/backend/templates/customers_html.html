{% extends "base.html" %}

{% block title %}客户管理 - 萌宠小屋{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
{% endblock %}

{% block content %}
<div class="container">
    <h1><i class="fas fa-users"></i> 客户管理</h1>
    
    <div class="card">
        <div class="action-bar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="搜索客户..." id="searchInput">
            </div>
            <button class="btn btn-primary" id="addCustomerBtn">
                <i class="fas fa-plus"></i> 添加客户
            </button>
        </div>
        
        <table id="customerTable">
            <thead>
                <tr>
                    <th>客户ID</th>
                    <th>姓名</th>
                    <th>性别</th>
                    <th>电话</th>
                    <th>地址</th>
                    <th>会员等级</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="customerTableBody">
                <!-- 客户数据将通过JavaScript动态加载 -->
            </tbody>
        </table>
    </div>
</div>

<!-- 添加/编辑客户模态框 -->
<div class="modal" id="customerModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 class="modal-title" id="modalTitle">添加新客户</h3>
            <button class="close-btn" id="closeModalBtn">&times;</button>
        </div>
        
        <form id="customerForm">
            <input type="hidden" id="customerId">
            
            <div class="form-group">
                <label for="customername">客户姓名 *</label>
                <input type="text" id="customername" required>
            </div>
            
            <div class="form-group">
                <label for="gender">性别 *</label>
                <select id="gender" required>
                    <option value="">请选择</option>
                    <option value="男">男</option>
                    <option value="女">女</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="address">地址 *</label>
                <input type="text" id="address" required>
            </div>
            
            <div class="form-group">
                <label for="telphone">电话 *</label>
                <input type="tel" id="telphone" required>
            </div>
            
            <div class="form-group">
                <label for="Membershiplevel">会员等级 *</label>
                <select id="Membershiplevel" required>
                    <option value="">请选择</option>
                    <option value="1">普通</option>
                    <option value="2">银卡</option>
                    <option value="3">金卡</option>
                    <option value="4">钻石</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="status">状态 *</label>
                <select id="status" required>
                    <option value="">请选择</option>
                    <option value="活跃">活跃</option>
                    <option value="休眠">休眠</option>
                    <option value="禁用">禁用</option>
                </select>
            </div>
            
            <div class="form-actions">
                <button type="button" class="btn" id="cancelBtn">取消</button>
                <button type="submit" class="btn btn-primary">保存</button>
            </div>
        </form>
    </div>
</div>

<!-- 加载指示器 -->
<div class="loading-overlay" id="loadingOverlay" style="display: none;">
    <div class="loading-spinner"></div>
</div>

<script src="{{ url_for('static', filename='js/api-client.js') }}"></script>
<script src="{{ url_for('static', filename='js/customers_js.js') }}"></script>
{% endblock %}
