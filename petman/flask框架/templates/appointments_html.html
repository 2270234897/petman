{% extends "base.html" %}

{% block title %}预约管理 - 萌宠小屋{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/appointments_css.css') }}">
{% endblock %}

{% block content %}
<div class="container">
    <h1><i class="far fa-calendar-alt"></i> 预约管理</h1>
    
    <div class="card">
        <div class="action-bar">
            <div class="filters">
                <div class="filter-group">
                    <label for="dateFilter">日期:</label>
                    <input type="date" id="dateFilter">
                </div>
                <div class="filter-group">
                    <label for="statusFilter">状态:</label>
                    <select id="statusFilter">
                        <option value="">全部</option>
                        <option value="待确认">待确认</option>
                        <option value="已确认">已确认</option>
                        <option value="已完成">已完成</option>
                        <option value="已取消">已取消</option>
                    </select>
                </div>
            </div>
            <button class="btn btn-primary" id="addAppointmentBtn">
                <i class="fas fa-plus"></i> 添加预约
            </button>
        </div>
        
        <div class="calendar-view">
            <div class="calendar-header">
                <button id="prevDay"><i class="fas fa-chevron-left"></i></button>
                <h3 id="currentDate">今天</h3>
                <button id="nextDay"><i class="fas fa-chevron-right"></i></button>
            </div>
            
            <div class="time-slots" id="timeSlots">
                <!-- 时间槽将通过JavaScript动态加载 -->
            </div>
        </div>
        
        <table id="appointmentTable">
            <thead>
                <tr>
                    <th>预约ID</th>
                    <th>客户</th>
                    <th>宠物</th>
                    <th>服务项目</th>
                    <th>日期</th>
                    <th>时间</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="appointmentTableBody">
                <!-- 预约数据将通过JavaScript动态加载 -->
            </tbody>
        </table>
    </div>
</div>

<!-- 添加/编辑预约模态框 -->
<div class="modal" id="appointmentModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 class="modal-title" id="modalTitle">添加新预约</h3>
            <button class="close-btn" id="closeModalBtn">&times;</button>
        </div>
        
        <form id="appointmentForm">
            <input type="hidden" id="appointmentId">
            
            <div class="form-row">
                <div class="form-group">
                    <label for="appointmentDate">日期 *</label>
                    <input type="date" id="appointmentDate" required>
                </div>
                
                <div class="form-group">
                    <label for="appointmentTime">时间 *</label>
                    <input type="time" id="appointmentTime" step="900" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="customerSelect">客户 *</label>
                <select id="customerSelect" required>
                    <option value="">请选择客户</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="petSelect">宠物 *</label>
                <select id="petSelect" required>
                    <option value="">请选择宠物</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="serviceSelect">服务项目 *</label>
                <select id="serviceSelect" required>
                    <option value="">请选择服务项目</option>
                </select>
                <div class="service-info" id="serviceInfo"></div>
            </div>
            
            <div class="form-group">
                <label for="appointmentNotes">备注</label>
                <textarea id="appointmentNotes" rows="3"></textarea>
            </div>
            
            <div class="form-actions">
                <button type="button" class="btn" id="cancelBtn">取消</button>
                <button type="submit" class="btn btn-primary">保存</button>
            </div>
        </form>
    </div>
</div>

<!-- 状态变更模态框 -->
<div class="modal" id="statusModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 class="modal-title">变更预约状态</h3>
            <button class="close-btn" id="closeStatusModalBtn">&times;</button>
        </div>
        
        <div class="form-group">
            <label for="newStatus">新状态 *</label>
            <select id="newStatus" required>
                <option value="">请选择状态</option>
                <option value="待确认">待确认</option>
                <option value="已确认">已确认</option>
                <option value="已完成">已完成</option>
                <option value="已取消">已取消</option>
            </select>
        </div>
        
        <div class="form-actions">
            <button type="button" class="btn" id="cancelStatusBtn">取消</button>
            <button type="button" class="btn btn-primary" id="saveStatusBtn">保存</button>
        </div>
    </div>
</div>

<!-- 加载指示器 -->
<div class="loading-overlay" id="loadingOverlay" style="display: none;">
    <div class="loading-spinner"></div>
</div>

<script src="{{ url_for('static', filename='js/api-client.js') }}"></script>
<script src="{{ url_for('static', filename='js/appointments_js.js') }}"></script>
{% endblock %}
