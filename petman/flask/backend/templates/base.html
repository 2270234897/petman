<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}宠物店管理系统{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <!-- 新增导航栏样式 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <h2>你好可爱宠物馆</h2>
            <p>宠物店管理系统</p>
        </div>
        <ul class="nav-menu">
            <!-- {{ url_for('customers.customers') }}中第一个customers是蓝图的名字，第二个customers是视图函数的名字 -->
            <li><a href="{{ url_for('customers.customers') }}" ><i class="fas fa-users"></i> 客户管理</a></li>

            <li><a href="{{ url_for('pets.pets') }}"><i class="fas fa-paw"></i> 宠物管理</a></li>

            <li><a href="{{ url_for('appointments.appointments') }}"><i class="fas fa-shopping-cart"></i> 预约管理</a></li>

            <li><a href="#"><i class="fas fa-user"></i> 销售管理</a></li>

            <li><a href="#"><i class="fas fa-user"></i> 库存管理</a></li>

            <li><a href="#"><i class="fas fa-chart-bar"></i> 统计分析</a></li>

            <li><a href="#"><i class="fas fa-cog"></i> 系统设置</a></li>
        </ul>
    </div>
    
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <!-- 全局脚本 -->
</body>
</html>
