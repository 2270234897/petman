<!-- templates/modals/product_modal.html -->
<div id="productModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 class="modal-title">添加/编辑商品</h2>
            <span class="close" onclick="closeModal('productModal')">&times;</span>
        </div>
        <div class="modal-body">
            <form id="product-form">
                <input type="hidden" id="product-id">
                <div class="form-group">
                    <label for="product-name">商品名称：</label>
                    <input type="text" id="product-name" required>
                </div>
                <div class="form-group">
                    <label for="product-classify">分类：</label>
                    <select id="product-classify" required></select>
                </div>
                <div class="form-group">
                    <label for="product-brand">品牌：</label>
                    <select id="product-brand" required></select>
                </div>
                <div class="form-group">
                    <label for="product-baozhiqi">保质期(月)：</label>
                    <input type="number" id="product-baozhiqi" required>
                </div>
                <div class="form-group">
                    <label for="product-local">产地：</label>
                    <input type="text" id="product-local" required>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('productModal')">取消</button>
                    <button type="submit" class="btn btn-success">保存</button>
                </div>
            </form>
        </div>
    </div>
</div>
