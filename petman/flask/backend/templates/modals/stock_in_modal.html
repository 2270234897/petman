<!-- templates/modals/stock_in_modal.html -->
<div id="stockInModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 class="modal-title">新增入库</h2>
            <span class="close" onclick="closeModal('stockInModal')">&times;</span>
        </div>
        <div class="modal-body">
            <form id="stock-in-form">
                <div class="form-group">
                    <label for="stock-in-dealer">经销商：</label>
                    <select id="stock-in-dealer" required></select>
                </div>
                <div class="form-group">
                    <label>入库明细：</label>
                    <table id="stock-in-detail-table">
                        <thead>
                            <tr>
                                <th>商品名称</th>
                                <th>规格</th>
                                <th>数量</th>
                                <th>进价</th>
                                <th>生产日期</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="product-name">-</td>
                                <td><select name="spec_id"></select></td>
                                <td><input type="number" name="quantity" min="1" value="1" required></td>
                                <td><input type="number" name="price_in" step="0.01" value="0.00" required></td>
                                <td><input type="date" name="product_date" required></td>
                                <td><button type="button" class="btn btn-danger" onclick="removeDetailRow(this)">删除</button></td>
                            </tr>
                        </tbody>
                    </table>
                    <button type="button" class="btn btn-secondary" onclick="addDetailRow()">+ 添加明细</button>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('stockInModal')">取消</button>
                    <button type="submit" class="btn btn-success">提交入库</button>
                </div>
            </form>
        </div>
    </div>
</div>
