<!-- templates/modals/brand_modal.html -->
<div id="brandModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 class="modal-title">添加/编辑品牌</h2>
            <span class="close" onclick="closeModal('brandModal')">&times;</span>
        </div>
        <div class="modal-body">
            <form id="brand-form">
                <input type="hidden" id="brand-id">
                <div class="form-group">
                    <label for="brand-name">品牌名称：</label>
                    <input type="text" id="brand-name" required>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('brandModal')">取消</button>
                    <button type="submit" class="btn btn-success">保存</button>
                </div>
            </form>
        </div>
    </div>
</div>
