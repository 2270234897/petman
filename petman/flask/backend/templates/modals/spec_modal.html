<!-- templates/modals/spec_modal.html -->
<div id="specModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 class="modal-title">添加/编辑规格</h2>
            <span class="close" onclick="closeModal('specModal')">&times;</span>
        </div>
        <div class="modal-body">
            <p>为商品 <strong id="spec-product-name">-</strong> 添加规格</p>
            <form id="spec-form">
                <input type="hidden" id="spec-id">
                <input type="hidden" id="spec-product-id">
                <div class="form-group">
                    <label for="spec-name">规格名称：</label>
                    <input type="text" id="spec-name" required>
                </div>
                <div class="form-group">
                    <label for="spec-value">规格值：</label>
                    <input type="text" id="spec-value" required>
                </div>
                <div class="form-group">
                    <label for="spec-barcode">条码：</label>
                    <input type="text" id="spec-barcode">
                </div>
                <div class="form-group">
                    <label for="spec-stock">库存：</label>
                    <input type="number" id="spec-stock" required value="0">
                </div>
                <div class="form-group">
                    <label for="spec-picture">图片：</label>
                    <input type="text" id="spec-picture">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('specModal')">取消</button>
                    <button type="submit" class="btn btn-success">保存</button>
                </div>
            </form>
        </div>
    </div>
</div>
