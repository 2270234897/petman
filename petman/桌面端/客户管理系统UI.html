<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户管理</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #8a2be2;
            --secondary-color: #ff6b6b;
            --background-color: #fff5f5;
            --card-color: #ffffff;
            --text-color: #333333;
            --text-light: #666666;
            --success-color: #4caf50;
            --warning-color: #ff9800;
            --info-color: #2196f3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--background-color);
            color: var(--text-color);
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card {
            background: var(--card-color);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .search-box {
            position: relative;
            width: 300px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px 10px 40px;
            border-radius: 50px;
            border: 1px solid #ddd;
            outline: none;
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
        }

        .btn {
            padding: 10px 20px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(138, 43, 226, 0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            color: var(--primary-color);
            font-weight: 600;
        }

        tr:hover {
            background: rgba(138, 43, 226, 0.05);
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .status-active {
            background: rgba(76, 175, 80, 0.15);
            color: var(--success-color);
        }

        .status-inactive {
            background: rgba(255, 152, 0, 0.15);
            color: var(--warning-color);
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            color: white;
        }

        .edit-btn {
            background: var(--info-color);
        }

        .delete-btn {
            background: var(--warning-color);
        }

        .action-btn:hover {
            transform: scale(1.1);
        }

        /* 模态框样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            width: 500px;
            max-width: 90%;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-size: 1.2rem;
            color: var(--primary-color);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-color);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            outline: none;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 1.5rem;
        }

        @media (max-width: 768px) {
            .action-bar {
                flex-direction: column;
                gap: 1rem;
            }
            
            .search-box {
                width: 100%;
            }
            
            table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-users"></i> 客户管理</h1>
        
        <div class="card">
            <div class="action-bar">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="搜索客户..." id="searchInput">
                </div>
                <button class="btn btn-primary" id="addCustomerBtn">
                    <i class="fas fa-plus"></i> 添加客户
                </button>
            </div>
            
            <table id="customerTable">
                <thead>
                    <tr>
                        <th>客户ID</th>
                        <th>姓名</th>
                        <th>性别</th>
                        <th>电话</th>
                        <th>会员等级</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="customerTableBody">
                    <!-- 客户数据将通过JavaScript动态加载 -->
                </tbody>
            </table>
        </div>
    </div>
    
    <!-- 添加/编辑客户模态框 -->
    <div class="modal" id="customerModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">添加新客户</h3>
                <button class="close-btn" id="closeModalBtn">&times;</button>
            </div>
            
            <form id="customerForm">
                <input type="hidden" id="customerId">
                
                <div class="form-group">
                    <label for="customername">客户姓名</label>
                    <input type="text" id="customername" required>
                </div>
                
                <div class="form-group">
                    <label for="gender">性别</label>
                    <select id="gender" required>
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="address">地址</label>
                    <input type="text" id="address" required>
                </div>
                
                <div class="form-group">
                    <label for="telphone">电话</label>
                    <input type="tel" id="telphone" required>
                </div>
                
                <div class="form-group">
                    <label for="Membershiplevel">会员等级</label>
                    <select id="Membershiplevel" required>
                        <option value="1">普通</option>
                        <option value="1">银卡</option>
                        <option value="2">金卡</option>
                        <option value="3">钻石</option>
                    </select>
                </div>
                
                <div class="form-actions">
                    <button type="button" class="btn" id="cancelBtn">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        // API基础URL
        const API_BASE_URL = 'http://localhost:5000/api/customers';
        
        // DOM元素
        const customerTableBody = document.getElementById('customerTableBody');
        const customerForm = document.getElementById('customerForm');
        const customerModal = document.getElementById('customerModal');
        const modalTitle = document.getElementById('modalTitle');
        const addCustomerBtn = document.getElementById('addCustomerBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const searchInput = document.getElementById('searchInput');
        
        // 当前操作模式（add/edit）
        let currentMode = 'add';
        
        // 初始化页面
        document.addEventListener('DOMContentLoaded', () => {
            loadCustomers();
            
            // 事件监听
            addCustomerBtn.addEventListener('click', () => {
                currentMode = 'add';
                modalTitle.textContent = '添加新客户';
                customerForm.reset();
                customerModal.style.display = 'flex';
            });
            
            closeModalBtn.addEventListener('click', () => {
                customerModal.style.display = 'none';
            });
            
            cancelBtn.addEventListener('click', () => {
                customerModal.style.display = 'none';
            });
            
            customerForm.addEventListener('submit', handleFormSubmit);
            
            searchInput.addEventListener('input', () => {
                const searchTerm = searchInput.value.toLowerCase();
                const rows = customerTableBody.querySelectorAll('tr');
                
                rows.forEach(row => {
                    const name = row.querySelector('td:nth-child(2)').textContent.toLowerCase();
                    const phone = row.querySelector('td:nth-child(4)').textContent.toLowerCase();
                    
                    if (name.includes(searchTerm) || phone.includes(searchTerm)) {
                        row.style.display = '';
                    } else {
                        row.style.display = 'none';
                    }
                });
            });
        });
        
        // 加载客户数据
        async function loadCustomers() {
            try {
                const response = await fetch(`${API_BASE_URL}/get`);
                const result = await response.json();
                
                if (result.status === 'success') {
                    renderCustomers(result.data);
                } else {
                    console.error('加载客户数据失败:', result.message);
                }
            } catch (error) {
                console.error('请求失败:', error);
            }
        }
        
        // 渲染客户列表
        function renderCustomers(customers) {
            customerTableBody.innerHTML = '';
            
            customers.forEach(customer => {
                const row = document.createElement('tr');
                
                row.innerHTML = `
                    <td>${customer.customerID}</td>
                    <td>${customer.customername}</td>
                    <td>${customer.gender}</td>
                    <td>${customer.telphone}</td>
                    <td>${customer.Membershiplevel}</td>
                    <td><span class="status-badge status-active">活跃</span></td>
                    <td>
                        <div class="action-btns">
                            <button class="action-btn edit-btn" onclick="editCustomer(${customer.customerID})">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="action-btn delete-btn" onclick="deleteCustomer(${customer.customerID})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </td>
                `;
                
                customerTableBody.appendChild(row);
            });
        }
        
        // 编辑客户
        window.editCustomer = async function(customerId) {
            try {
                const response = await fetch(`${API_BASE_URL}/get`);
                const result = await response.json();
                
                if (result.status === 'success') {
                    const customer = result.data.find(c => c.customerID == customerId);
                    
                    if (customer) {
                        currentMode = 'edit';
                        modalTitle.textContent = '编辑客户信息';
                        
                        // 填充表单
                        document.getElementById('customerId').value = customer.customerID;
                        document.getElementById('customername').value = customer.customername;
                        document.getElementById('gender').value = customer.gender;
                        document.getElementById('address').value = customer.address;
                        document.getElementById('telphone').value = customer.telphone;
                        document.getElementById('Membershiplevel').value = customer.Membershiplevel;
                        
                        customerModal.style.display = 'flex';
                    }
                }
            } catch (error) {
                console.error('获取客户信息失败:', error);
            }
        };
        
        // 删除客户
        window.deleteCustomer = async function(customerId) {
            if (confirm('确定要删除这个客户吗？此操作不可撤销。')) {
                try {
                    const response = await fetch(`${API_BASE_URL}/delete/${customerId}`, {
                        method: 'DELETE'
                    });
                    
                    const result = await response.json();
                    
                    if (result.status === 'success') {
                        alert('客户删除成功');
                        loadCustomers();
                    } else {
                        alert('删除失败: ' + result.message);
                    }
                } catch (error) {
                    console.error('删除客户失败:', error);
                    alert('删除客户时出错');
                }
            }
        };
        
        // 处理表单提交
        async function handleFormSubmit(e) {
            e.preventDefault();
            
            const customerData = {
                customername: document.getElementById('customername').value,
                gender: document.getElementById('gender').value,
                address: document.getElementById('address').value,
                telphone: document.getElementById('telphone').value,
                Membershiplevel: document.getElementById('Membershiplevel').value
            };
            
            try {
                let response, result;
                
                if (currentMode === 'add') {
                    // 添加新客户
                    response = await fetch(`${API_BASE_URL}/post`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify(customerData),           
                    });
                    
                    // 检查响应内容类型
                    const contentType = response.headers.get('content-type');
                    if (!contentType || !contentType.includes('application/json')) {
                        const text = await response.text();
                        throw new Error(`服务器返回了非JSON响应: ${text.substring(0, 100)}...`);
                    }
                    result = await response.json();
                    
                    if (result.status === 'success') {
                        alert('客户添加成功');
                        customerModal.style.display = 'none';
                        loadCustomers();
                    } else {
                        alert('添加失败: ' + result.message);
                    }
                } else {
                    // 更新客户信息
                    const customerId = document.getElementById('customerId').value;
                    response = await fetch(`${API_BASE_URL}/${customerId}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(customerData)
                    });
                    
                    result = await response.json();
                    
                    if (result.status === 'success') {
                        alert('客户信息更新成功');
                        customerModal.style.display = 'none';
                        loadCustomers();
                    } else {
                        alert('更新失败: ' + result.message);
                    }
                }
            } catch (error) {
                console.error('表单提交失败:', error);
                alert('操作失败，请检查控制台');
            }
        }
    </script>
</body>
</html>
